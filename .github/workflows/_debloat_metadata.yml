name: Debloat Metadata

on:
  push:
    branches:
      - experiment-debloat

permissions:
  contents: write

jobs:
  consolidate-metadata:
    if: github.actor == 'srujithanchuri'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-debloat
          fetch-depth: 1

      - name: Consolidate metadata parsers
        shell: python
        run: |
          from pathlib import Path
          import ast

          root = Path('pyside6_studio')
          gallery = root / 'widgets' / 'gallery_browser.py'
          dataset = root / 'widgets' / 'dataset_explorer.py'
          main = root / 'main_window.py'
          metadata = root / 'core' / 'metadata.py'

          def function_source(path, name):
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return ''.join(lines[node.lineno - 1:node.end_lineno])
              raise SystemExit(f'{name} not found in {path}')

          parse_plot = function_source(gallery, 'parse_plot_metadata')
          parse_params = function_source(dataset, 'parse_filename_parameters')

          metadata.parent.mkdir(parents=True, exist_ok=True)
          metadata.write_text(
              '"""Shared parsing of simulation filenames into physics metadata.\n\n'
              'This module intentionally contains no Qt or application-controller dependencies.\n'
              'Filename grammar is treated as a compatibility/data-schema contract.\n'
              '"""\n\n'
              'import os\n'
              'import re\n'
              'from typing import Tuple\n\n\n'
              + parse_params + '\n\n\n' + parse_plot,
              encoding='utf-8',
          )

          def remove_top_level_function(path, name):
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      start = node.lineno - 1
                      end = node.end_lineno
                      path.write_text(''.join(lines[:start] + lines[end:]), encoding='utf-8')
                      return
              raise SystemExit(f'{name} not found in {path}')

          remove_top_level_function(dataset, 'parse_filename_parameters')
          remove_top_level_function(gallery, 'parse_plot_metadata')

          def ensure_import(path, import_line, anchor):
              text = path.read_text(encoding='utf-8')
              if import_line in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'Import anchor not found in {path}: {anchor}')
              path.write_text(text.replace(anchor, anchor + import_line, 1), encoding='utf-8')

          ensure_import(dataset, 'from pyside6_studio.core.metadata import parse_filename_parameters\n', 'from pyside6_studio.core.cache_manager import normalize_results_dir\n')
          ensure_import(gallery, 'from pyside6_studio.core.metadata import parse_plot_metadata, parse_filename_parameters\n', 'from pyside6_studio.core.cache_manager import normalize_results_dir\n')
          ensure_import(main, 'from pyside6_studio.core.metadata import parse_plot_metadata\n', 'from pyside6_studio.widgets.interactive_mode_nav import InteractiveModeNavWidget\n')

          text = main.read_text(encoding='utf-8')
          text = text.replace('from pyside6_studio.widgets.gallery_browser import PlotGalleryWidget, parse_plot_metadata\n', 'from pyside6_studio.widgets.gallery_browser import PlotGalleryWidget\n')
          main.write_text(text, encoding='utf-8')

          for path in (metadata, dataset, gallery, main):
              ast.parse(path.read_text(encoding='utf-8'))
          assert 'def parse_filename_parameters' in metadata.read_text(encoding='utf-8')
          assert 'def parse_plot_metadata' in metadata.read_text(encoding='utf-8')
          assert 'def parse_filename_parameters' not in dataset.read_text(encoding='utf-8')
          assert 'def parse_plot_metadata' not in gallery.read_text(encoding='utf-8')

      - name: Commit metadata bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/core/metadata.py pyside6_studio/widgets/dataset_explorer.py pyside6_studio/widgets/gallery_browser.py pyside6_studio/main_window.py
          git diff --cached --check
          git commit -m "refactor: centralize simulation metadata parsing"
          git push origin HEAD:experiment-debloat
