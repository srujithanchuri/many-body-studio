name: Remove legacy plotter
on:
  push:
    branches: [experiment-debloat]
    paths: ['.legacy-plotter-trigger']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Data Plotter and Figure Composer remnants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          replace(
              'pyside6_studio/main_window.py',
              'from pyside6_studio.widgets.data_plotter import InteractiveDataCanvas, VectorExportDialog\n',
              ''
          )
          replace(
              'pyside6_studio/widgets/__init__.py',
              '- InteractiveDataCanvas: Dynamic multi-curve dataset slice plotter.\n',
              ''
          )
          replace(
              'pyside6_studio/widgets/__init__.py',
              'from pyside6_studio.widgets.data_plotter import InteractiveDataCanvas\n',
              ''
          )
          replace(
              'pyside6_studio/widgets/__init__.py',
              '    "InteractiveDataCanvas",\n',
              ''
          )

          p = Path('tests/test_dataset_explorer.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(' and InteractiveDataCanvas', '')
          s = s.replace('from pyside6_studio.widgets.data_plotter import InteractiveDataCanvas\n', '')
          start = s.index('    def test_05_interactive_data_canvas(self):')
          end = s.index('    def test_06_smart_parameter_search_matrix(self):', start)
          s = s[:start] + s[end:]
          s = s.replace('test_06_smart_parameter_search_matrix', 'test_05_smart_parameter_search_matrix')
          p.write_text(s, encoding='utf-8')

          for path in ['README.md', 'docs/HOW_TO_USE.md', 'STUDIO_ARCHITECTURE_PLAN.md', 'tools/build_user_guide.py', 'AGENTS.md', 'pyside6_studio/main_window.py']:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              lines = s.splitlines(keepends=True)
              kept = [line for line in lines if 'Figure Composer' not in line and 'FigureComposer' not in line]
              p.write_text(''.join(kept), encoding='utf-8')

          p = Path('AGENTS.md')
          s = '\n'.join(line for line in p.read_text(encoding='utf-8').split('\n') if 'widgets/data_plotter.py' not in line and 'InteractiveDataCanvas' not in line)
          p.write_text(s, encoding='utf-8')

          p = Path('docs/HOW_TO_USE.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<[^>]*>[^<]*Standalone Figure Composer workspace plan was scrapped[^<]*</[^>]*>', '', s)
              s = re.sub(r'[^<]*Standalone Figure Composer workspace plan was scrapped[^<]*', '', s)
              s = '\n'.join(line.rstrip() for line in s.splitlines()) + '\n'
              p.write_text(s, encoding='utf-8')
          PY

          git rm pyside6_studio/widgets/data_plotter.py pyside6_studio/widgets/vector_export_dialog.py
          python -m compileall -q pyside6_studio tests
          git diff --check
          git status --short
          git add -A
          git commit -m 'chore: remove unused legacy data plotter'
          git push origin experiment-debloat
