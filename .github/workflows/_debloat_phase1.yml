name: Debloat Phase 1

on:
  push:
    branches:
      - experiment-debloat

permissions:
  contents: write

jobs:
  extract-cache-dialog:
    if: github.actor == 'srujithanchuri'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment-debloat
          fetch-depth: 1

      - name: Extract CacheManagerDialog
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('pyside6_studio/main_window.py')
          module_path = Path('pyside6_studio/widgets/cache_manager_dialog.py')
          text = main_path.read_text(encoding='utf-8')

          start_marker = 'class CacheManagerDialog(QDialog):\n'
          end_marker = '\n\nclass UnifiedWorkbenchWindow(QMainWindow):\n'
          if start_marker not in text:
              raise SystemExit('CacheManagerDialog already extracted; nothing to do.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          if module_path.exists():
              raise SystemExit('Refusing to overwrite existing cache_manager_dialog.py')

          header = '''"""Cache manager dialog for reusable computational foundation arrays."""\n\nimport os\nimport time\n\nfrom PySide6.QtWidgets import (\n    QDialog, QVBoxLayout, QHBoxLayout, QLabel, QTableWidget, QHeaderView,\n    QAbstractItemView, QPushButton, QMessageBox, QTableWidgetItem,\n)\n\nfrom pyside6_studio.core.cache_manager import (\n    normalize_results_dir,\n    get_cache_stats,\n    purge_cache,\n)\n\n\n'''
          module_path.parent.mkdir(parents=True, exist_ok=True)
          module_path.write_text(header + block, encoding='utf-8')

          import_line = 'from pyside6_studio.widgets.cache_manager_dialog import CacheManagerDialog\n'
          anchor = 'from pyside6_studio.widgets.interactive_mode_nav import InteractiveModeNavWidget\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find stable import anchor in main_window.py')
              text = text.replace(anchor, anchor + import_line, 1)

          # Remove the class as a complete top-level block, preserving the surrounding class indentation.
          text = text[:start] + '\n\n' + text[end + 2:]
          text = text.replace('    QDialog, QAbstractItemView\n', '')
          main_path.write_text(text, encoding='utf-8')

          main_after = main_path.read_text(encoding='utf-8')
          if 'class CacheManagerDialog' in main_after:
              raise SystemExit('Extraction failed: class still present in main_window.py')
          if 'class CacheManagerDialog' not in module_path.read_text(encoding='utf-8'):
              raise SystemExit('Extraction failed: class missing from new module')

      - name: Smoke-check Python syntax
        shell: bash
        run: |
          python -m py_compile pyside6_studio/main_window.py pyside6_studio/widgets/cache_manager_dialog.py

      - name: Commit extraction and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/main_window.py pyside6_studio/widgets/cache_manager_dialog.py .github/workflows/_debloat_phase1.yml
          git diff --cached --check
          git commit -m "refactor: extract cache manager dialog"
          git rm .github/workflows/_debloat_phase1.yml
          git commit -m "chore: remove temporary debloat workflow"
          git push origin HEAD:experiment-debloat
