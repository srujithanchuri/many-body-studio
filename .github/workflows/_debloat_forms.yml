name: Debloat Study Forms

on:
  push:
    branches:
      - experiment-debloat

permissions:
  contents: write

jobs:
  extract-study-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-debloat
          fetch-depth: 1

      - name: Extract study form builders
        shell: python
        run: |
          from pathlib import Path
          import ast
          import textwrap

          main = Path('pyside6_studio/main_window.py')
          text = main.read_text(encoding='utf-8')

          specs = [
              ('spectral_form.py', 'build_spectral_form', '# 2a. Spectral Sweep parameters', 'self.param_stack.addWidget(grp_se)'),
              ('self_energy_form.py', 'build_spectral_function_form', '# 2b. Spectral Function A(k, omega) parameters', 'self.param_stack.addWidget(grp_spec)'),
              ('phase_diagram_form.py', 'build_phase_diagram_form', '# 2c. Phase Diagram parameters', 'self.param_stack.addWidget(grp_pd)'),
              ('susceptibility_form.py', 'build_susceptibility_form', '# 2d. Susceptibility parameters', 'self.param_stack.addWidget(grp_susc)'),
              ('conductivity_form.py', 'build_conductivity_form', '# 2e. Electrical / Optical Conductivity parameters', 'self.param_stack.addWidget(grp_cond)'),
          ]

          forms_dir = Path('pyside6_studio/widgets/study_forms')
          forms_dir.mkdir(parents=True, exist_ok=True)
          (forms_dir / '__init__.py').write_text('"""Study-specific simulation parameter form builders."""\n', encoding='utf-8')
          (forms_dir / 'form_helpers.py').write_text(
              '"""Small helpers shared by study form builders.\n\n'
              'Widget classes remain in main_window.py for compatibility; the import is lazy.\n'
              '"""\n\n'
              'def study_widget_types():\n'
              '    """Return the application-specific card and combo-box widget classes."""\n'
              '    from pyside6_studio.main_window import ModernCard, ModernComboBox\n'
              '    return ModernCard, ModernComboBox\n', encoding='utf-8')

          replacements = []
          for filename, func_name, marker, end_marker in specs:
              start = text.find(marker)
              if start < 0 and filename == 'self_energy_form.py':
                  start = text.find('# 2b. Spectral Function A(k, ω) parameters')
              if start < 0:
                  raise SystemExit(f'marker not found: {marker}')
              end_rel = text.find(end_marker, start)
              if end_rel < 0:
                  raise SystemExit(f'end marker not found: {end_marker}')
              end = end_rel + len(end_marker)
              body = textwrap.dedent(text[start:end])
              card_name = end_marker.split('(')[0].split('.')[-1]
              function = (
                  '"""Build a study parameter card while preserving the original UI contract."""\n\n'
                  f'def {func_name}(window):\n'
                  '    from PySide6.QtWidgets import QVBoxLayout, QHBoxLayout, QLabel, QLineEdit, QDoubleSpinBox, QSpinBox, QPushButton, QCheckBox, QSizePolicy\n'
                  '    from .form_helpers import study_widget_types\n'
                  '    ModernCard, ModernComboBox = study_widget_types()\n'
                  '    self = window\n'
                  + textwrap.indent(body, '    ') + '\n'
                  + f'    return {card_name}\n'
              )
              (forms_dir / filename).write_text(function, encoding='utf-8')
              replacements.append((start, end, f'        self.param_stack.addWidget(build_{filename.removesuffix("_form.py")}(self))'))

          for start, end, repl in sorted(replacements, reverse=True):
              text = text[:start] + repl + text[end:]

          imports = (
              'from pyside6_studio.widgets.study_forms.spectral_form import build_spectral_form\n'
              'from pyside6_studio.widgets.study_forms.self_energy_form import build_spectral_function_form\n'
              'from pyside6_studio.widgets.study_forms.phase_diagram_form import build_phase_diagram_form\n'
              'from pyside6_studio.widgets.study_forms.susceptibility_form import build_susceptibility_form\n'
              'from pyside6_studio.widgets.study_forms.conductivity_form import build_conductivity_form\n'
          )
          anchor = 'from pyside6_studio.widgets.cache_manager_dialog import CacheManagerDialog\n'
          if imports not in text:
              text = text.replace(anchor, anchor + imports, 1)
          main.write_text(text, encoding='utf-8')

          for path in [main, *sorted(forms_dir.glob('*.py'))]:
              ast.parse(path.read_text(encoding='utf-8'))

      - name: Commit study form bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/main_window.py pyside6_studio/widgets/study_forms
          git diff --cached --check
          git commit -m "refactor: extract study parameter forms"
          git push origin HEAD:experiment-debloat
