name: Debloat Study Forms 2

on:
  push:
    branches: [experiment-debloat]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-debloat
          fetch-depth: 1
      - name: Extract forms
        shell: python
        run: |
          from pathlib import Path
          import ast, textwrap
          main = Path('pyside6_studio/main_window.py')
          text = main.read_text(encoding='utf-8')
          specs = [
            ('spectral_form.py','build_spectral_form','# 2a. Spectral Sweep parameters','self.param_stack.addWidget(grp_se)'),
            ('self_energy_form.py','build_spectral_function_form','# 2b. Spectral Function A(k, ω) parameters','self.param_stack.addWidget(grp_spec)'),
            ('phase_diagram_form.py','build_phase_diagram_form','# 2c. Phase Diagram parameters','self.param_stack.addWidget(grp_pd)'),
            ('susceptibility_form.py','build_susceptibility_form','# 2d. Susceptibility parameters','self.param_stack.addWidget(grp_susc)'),
            ('conductivity_form.py','build_conductivity_form','# 2e. Electrical / Optical Conductivity parameters','self.param_stack.addWidget(grp_cond)'),
          ]
          d=Path('pyside6_studio/widgets/study_forms'); d.mkdir(parents=True,exist_ok=True)
          (d/'__init__.py').write_text('"""Study-specific simulation parameter form builders."""\n',encoding='utf-8')
          (d/'form_helpers.py').write_text('''"""Helpers shared by study form builders."""\n\ndef study_widget_types():\n    from pyside6_studio.main_window import ModernCard, ModernComboBox\n    return ModernCard, ModernComboBox\n''',encoding='utf-8')
          reps=[]
          for fn,func,marker,endm in specs:
            s=text.find(marker); e=text.find(endm,s)
            if s<0 or e<0: raise SystemExit(f'marker failure {fn}')
            e+=len(endm); body=textwrap.dedent(text[s:e])
            card=endm.split('(')[0].split('.')[-1]
            src='''"""Study parameter form builder."""\n\ndef FUNC(window):\n    from PySide6.QtWidgets import QVBoxLayout, QHBoxLayout, QLabel, QLineEdit, QDoubleSpinBox, QSpinBox, QPushButton, QCheckBox, QSizePolicy\n    from .form_helpers import study_widget_types\n    ModernCard, ModernComboBox = study_widget_types()\n    self = window\nBODY\n    return CARD\n'''.replace('FUNC',func).replace('BODY',textwrap.indent(body,'    ')).replace('CARD',card)
            (d/fn).write_text(src,encoding='utf-8')
            reps.append((s,e,f'        self.param_stack.addWidget({func}(self))'))
          for s,e,r in sorted(reps,reverse=True): text=text[:s]+r+text[e:]
          anchor='from pyside6_studio.widgets.cache_manager_dialog import CacheManagerDialog\n'
          imports=''.join(f'from pyside6_studio.widgets.study_forms.{fn.removesuffix("_form.py")} import {func}\n' for fn,func,_,_ in specs)
          text=text.replace(anchor,anchor+imports,1)
          main.write_text(text,encoding='utf-8')
          for p in [main,*d.glob('*.py')]: ast.parse(p.read_text(encoding='utf-8'))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/main_window.py pyside6_studio/widgets/study_forms
          git diff --cached --check
          git commit -m "refactor: extract study parameter forms"
          git push origin HEAD:experiment-debloat
