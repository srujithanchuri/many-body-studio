name: Bundle 3 Refactor

on:
  push:
    branches: [experiment-debloat]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'bundle 3 refactor complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-debloat

      - name: Extract Bundle 3 UI/theme helpers
        shell: python
        run: |
          from pathlib import Path
          import ast
          import re

          root = Path('.')

          def method_span(text, name):
              lines = text.splitlines(True)
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name and node.col_offset == 4:
                      start = node.lineno - 1
                      end = node.end_lineno
                      return lines, start, end, ''.join(lines[start+1:end])
              raise RuntimeError(f'method not found: {name}')

          # ---------------------------------------------------------------
          # Interactive plot UI construction.
          # ---------------------------------------------------------------
          ip = root / 'pyside6_studio/widgets/interactive_plots.py'
          original = ip.read_text(encoding='utf-8')
          lines, s_ui, e_ui, ui_body = method_span(original, '_build_ui')
          lines, s_theme, e_theme, theme_body = method_span(original, 'set_theme')
          body_owner = re.sub(r'\bself\b', 'owner', ui_body)

          class_start = original.index('class ModernComboBox(')
          class_end = original.index('\n\nclass InteractivePlotsWidget(', class_start)
          combo_class = original[class_start:class_end]

          controls = '''"""UI construction helpers for the Interactive Plots viewport.\n\nThe builder receives the owning InteractivePlotsWidget so its existing\nattributes, callbacks, object names and compatibility aliases are preserved.\nPhysics/state logic remains in interactive_plots.py.\n"""\n\nimport numpy as np\nfrom matplotlib.figure import Figure\nfrom matplotlib.backends.backend_qtagg import FigureCanvasQTAgg, NavigationToolbar2QT\n\nfrom PySide6.QtCore import Qt, QSize\nfrom PySide6.QtWidgets import (\n    QApplication, QWidget, QVBoxLayout, QHBoxLayout, QLabel, QPushButton,\n    QComboBox, QSlider, QFrame, QDoubleSpinBox, QSizePolicy,\n)\n\n\n'''
          controls += combo_class + '\n\n\ndef build_interactive_plot_ui(owner):\n'
          controls += ''.join('    ' + line if line.strip() else line for line in body_owner.splitlines(True))
          (root / 'pyside6_studio/widgets/interactive_plot_controls.py').write_text(controls, encoding='utf-8')

          text = original[:class_start] + 'from pyside6_studio.widgets.interactive_plot_controls import ModernComboBox, build_interactive_plot_ui\n\n\n' + original[class_end+2:]
          # Recompute _build_ui span after removing the top-level helper class.
          lines2, s2, e2, _ = method_span(text, '_build_ui')
          replacement_ui = '    def _build_ui(self):\n        build_interactive_plot_ui(self)\n'
          text = ''.join(lines2[:s2]) + replacement_ui + ''.join(lines2[e2:])
          # Extract set_theme from the post-UI-extraction text and replace it with a wrapper.
          lines3, st, et, tb = method_span(text, 'set_theme')
          tb_owner = re.sub(r'\bself\b', 'owner', tb)
          theme = '''"""Presentation theme helpers for Interactive Plots.\n\nNo numerical, cache, or physics behavior belongs here.\n"""\n\n\ndef apply_interactive_plot_theme(owner, is_dark: bool):\n'''
          theme += ''.join('    ' + line if line.strip() else line for line in tb_owner.splitlines(True))
          (root / 'pyside6_studio/widgets/interactive_plot_theme.py').write_text(theme, encoding='utf-8')
          text = ''.join(lines3[:st]) + '    def set_theme(self, is_dark: bool):\n        apply_interactive_plot_theme(self, is_dark)\n' + ''.join(lines3[et:])
          marker = 'from pyside6_studio.widgets.foundation_cache_dialog import FoundationCacheDialog\n'
          text = text.replace(marker, marker + 'from pyside6_studio.widgets.interactive_plot_theme import apply_interactive_plot_theme\n')
          ip.write_text(text, encoding='utf-8')

          # ---------------------------------------------------------------
          # Main-window dynamic theme presentation helpers.
          # ---------------------------------------------------------------
          mw = root / 'pyside6_studio/main_window.py'
          original = mw.read_text(encoding='utf-8')
          names = ['_update_bottom_dock_theme', '_update_statusbar_theme', 'toggle_theme']
          extracted = {}
          spans = []
          for name in names:
              lines, s, e, body = method_span(original, name)
              extracted[name] = re.sub(r'\bself\b', 'owner', body)
              spans.append((s, e, name))

          main_theme = '''"""Presentation theme helpers for the main Many-Body Studio window.\n\nThe controller retains stable method names; this module owns only dynamic\nstyling/palette propagation and contains no simulation or queue logic.\n"""\n\nfrom PySide6.QtWidgets import QApplication\nfrom PySide6.QtGui import QColor\n\nfrom pyside6_studio.theme import (\n    LIGHT_THEME_QSS, DARK_THEME_QSS, create_light_palette, create_dark_palette,\n)\n\n\n'''
          fn_names = {
              '_update_bottom_dock_theme': 'update_bottom_dock_theme',
              '_update_statusbar_theme': 'update_statusbar_theme',
              'toggle_theme': 'toggle_main_window_theme',
          }
          for name in names:
              sig = 'owner' if name == 'toggle_theme' else 'owner, is_dark: bool'
              main_theme += f'def {fn_names[name]}({sig}):\n'
              main_theme += ''.join('    ' + line if line.strip() else line for line in extracted[name].splitlines(True))
              main_theme += '\n\n'
          (root / 'pyside6_studio/main_window_theme.py').write_text(main_theme, encoding='utf-8')

          # Replace all three methods in one reverse-order pass using spans from
          # the untouched source, so no line-number drift can corrupt extraction.
          replacements = {
              '_update_bottom_dock_theme': '    def _update_bottom_dock_theme(self, is_dark: bool):\n        update_bottom_dock_theme(self, is_dark)\n',
              '_update_statusbar_theme': '    def _update_statusbar_theme(self, is_dark: bool):\n        update_statusbar_theme(self, is_dark)\n',
              'toggle_theme': '    def toggle_theme(self):\n        toggle_main_window_theme(self)\n',
          }
          lines = original.splitlines(True)
          for s, e, name in sorted(spans, reverse=True):
              lines[s:e] = [replacements[name]]
          text = ''.join(lines)
          marker = 'from pyside6_studio.widgets.cache_manager_dialog import CacheManagerDialog\n'
          text = text.replace(marker, marker + 'from pyside6_studio.main_window_theme import update_bottom_dock_theme, update_statusbar_theme, toggle_main_window_theme\n')
          mw.write_text(text, encoding='utf-8')

          for p in [ip, mw, root / 'pyside6_studio/widgets/interactive_plot_controls.py', root / 'pyside6_studio/widgets/interactive_plot_theme.py', root / 'pyside6_studio/main_window_theme.py']:
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          print('Bundle 3 extraction complete; AST validation passed.')

      - name: Verify and commit
        shell: bash
        run: |
          python -m compileall -q pyside6_studio
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/main_window.py pyside6_studio/main_window_theme.py pyside6_studio/widgets/interactive_plots.py pyside6_studio/widgets/interactive_plot_controls.py pyside6_studio/widgets/interactive_plot_theme.py
          git commit -m "refactor: bundle 3 refactor complete"
          git push origin HEAD:experiment-debloat
