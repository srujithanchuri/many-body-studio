name: Bundle 3 Refactor

on:
  push:
    branches: [experiment-debloat]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'bundle 3 refactor complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-debloat

      - name: Extract Bundle 3 UI/theme helpers
        shell: python
        run: |
          from pathlib import Path
          import ast
          import re

          root = Path('.')

          def method_span(text, method_name, next_name=None):
              lines = text.splitlines(True)
              start = next(i for i, line in enumerate(lines) if line.startswith(f'    def {method_name}('))
              if next_name:
                  end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith(f'    def {next_name}('))
              else:
                  end = len(lines)
              return lines, start, end

          def extract_method(path, method_name, next_name):
              text = path.read_text(encoding='utf-8')
              lines, start, end = method_span(text, method_name, next_name)
              body = ''.join(lines[start+1:end])
              if not body:
                  raise RuntimeError(f'empty body for {method_name} in {path}')
              return text, lines, start, end, body

          # Interactive plot controls.
          ip = root / 'pyside6_studio/widgets/interactive_plots.py'
          text, lines, start, end, body = extract_method(ip, '_build_ui', 'set_output_dir')
          body_owner = re.sub(r'\bself\b', 'owner', body)

          helper = '''"""UI construction helpers for the Interactive Plots viewport.\n\nThe builder deliberately receives the owning InteractivePlotsWidget so the\ncontroller keeps its existing attributes, callbacks, object names and public\ncompatibility aliases. Physics/state logic remains in interactive_plots.py.\n"""\n\nimport numpy as np\nfrom matplotlib.figure import Figure\nfrom matplotlib.backends.backend_qtagg import FigureCanvasQTAgg, NavigationToolbar2QT\n\nfrom PySide6.QtCore import Qt, QSize\nfrom PySide6.QtWidgets import (\n    QApplication, QWidget, QVBoxLayout, QHBoxLayout, QLabel, QPushButton,\n    QComboBox, QSlider, QFrame, QDoubleSpinBox, QSizePolicy,\n)\n\n\n'''

          class_start = text.index('class ModernComboBox(')
          class_end = text.index('\n\nclass InteractivePlotsWidget(', class_start)
          combo_class = text[class_start:class_end]
          helper += combo_class + '\n\n\ndef build_interactive_plot_ui(owner):\n'
          helper += ''.join('    ' + line if line.strip() else line for line in body_owner.splitlines(True))
          (root / 'pyside6_studio/widgets/interactive_plot_controls.py').write_text(helper, encoding='utf-8')

          text2 = text[:class_start] + 'from pyside6_studio.widgets.interactive_plot_controls import ModernComboBox, build_interactive_plot_ui\n\n\n' + text[class_end+2:]
          lines2 = text2.splitlines(True)
          s2 = next(i for i, line in enumerate(lines2) if line.startswith('    def _build_ui(self):'))
          e2 = next(i for i in range(s2 + 1, len(lines2)) if lines2[i].startswith('    def set_output_dir('))
          replacement = '    def _build_ui(self):\n        build_interactive_plot_ui(self)\n\n'
          text2 = ''.join(lines2[:s2]) + replacement + ''.join(lines2[e2:])
          ip.write_text(text2, encoding='utf-8')

          # Interactive plot theme.
          text = ip.read_text(encoding='utf-8')
          lines = text.splitlines(True)
          s = next(i for i, line in enumerate(lines) if line.startswith('    def set_theme(self, is_dark: bool):'))
          e = next(i for i in range(s + 1, len(lines)) if lines[i].startswith('    @property'))
          body = ''.join(lines[s+1:e])
          body_owner = re.sub(r'\bself\b', 'owner', body)
          body_lines = body_owner.splitlines(True)
          if body_lines and body_lines[0].strip() == 'owner.is_dark = is_dark':
              body_owner = ''.join(body_lines[1:])
          theme_helper = '''"""Theme helpers for the Interactive Plots viewport.\n\nThis module owns presentation-only colors/QSS. It intentionally does not\ncontain numerical or cache/physics logic.\n"""\n\n\ndef apply_interactive_plot_theme(owner, is_dark: bool):\n    owner.is_dark = is_dark\n'''
          theme_helper += ''.join('    ' + line if line.strip() else line for line in body_owner.splitlines(True))
          (root / 'pyside6_studio/widgets/interactive_plot_theme.py').write_text(theme_helper, encoding='utf-8')

          wrapper = '    def set_theme(self, is_dark: bool):\n        apply_interactive_plot_theme(self, is_dark)\n\n'
          new_text = ''.join(lines[:s]) + wrapper + ''.join(lines[e:])
          import_marker = 'from pyside6_studio.widgets.foundation_cache_dialog import FoundationCacheDialog\n'
          new_text = new_text.replace(import_marker, import_marker + 'from pyside6_studio.widgets.interactive_plot_theme import apply_interactive_plot_theme\n')
          ip.write_text(new_text, encoding='utf-8')

          # Main-window theme.
          mw = root / 'pyside6_studio/main_window.py'
          text = mw.read_text(encoding='utf-8')
          lines = text.splitlines(True)
          s = next(i for i, line in enumerate(lines) if line.startswith('    def set_theme(self, is_dark: bool):'))
          e = next(i for i in range(s + 1, len(lines)) if lines[i].startswith('    def ') and not lines[i].startswith('    def set_theme('))
          body = ''.join(lines[s+1:e])
          body_owner = re.sub(r'\bself\b', 'owner', body)
          body_lines = body_owner.splitlines(True)
          if body_lines and body_lines[0].strip() == 'owner.is_dark = is_dark':
              body_owner = ''.join(body_lines[1:])
          mw_theme = '''"""Dynamic theme application for the main Many-Body Studio window.\n\nThis keeps the large widget-specific styling routine out of the application\ncontroller while preserving the existing public set_theme(owner, is_dark) API.\n"""\n\nfrom PySide6.QtWidgets import QApplication\n\nfrom pyside6_studio.theme import (\n    LIGHT_THEME_QSS, DARK_THEME_QSS, create_light_palette, create_dark_palette,\n)\n\n\ndef apply_main_window_theme(owner, is_dark: bool):\n    owner.is_dark = is_dark\n'''
          mw_theme += ''.join('    ' + line if line.strip() else line for line in body_owner.splitlines(True))
          (root / 'pyside6_studio/main_window_theme.py').write_text(mw_theme, encoding='utf-8')
          wrapper = '    def set_theme(self, is_dark: bool):\n        apply_main_window_theme(self, is_dark)\n\n'
          new_mw = ''.join(lines[:s]) + wrapper + ''.join(lines[e:])
          marker = 'from pyside6_studio.widgets.cache_manager_dialog import CacheManagerDialog\n'
          new_mw = new_mw.replace(marker, marker + 'from pyside6_studio.main_window_theme import apply_main_window_theme\n')
          mw.write_text(new_mw, encoding='utf-8')

          for p in [ip, mw, root / 'pyside6_studio/widgets/interactive_plot_controls.py', root / 'pyside6_studio/widgets/interactive_plot_theme.py', root / 'pyside6_studio/main_window_theme.py']:
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))

          print('Bundle 3 extraction complete; AST validation passed.')

      - name: Verify and commit
        shell: bash
        run: |
          python -m compileall -q pyside6_studio
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/main_window.py pyside6_studio/main_window_theme.py pyside6_studio/widgets/interactive_plots.py pyside6_studio/widgets/interactive_plot_controls.py pyside6_studio/widgets/interactive_plot_theme.py
          git commit -m "refactor: bundle 3 refactor complete"
          git push origin HEAD:experiment-debloat
