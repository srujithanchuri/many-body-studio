name: Fix Study Forms

on:
  push:
    branches: [experiment-debloat]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-debloat
          fetch-depth: 1
      - name: Fix form builders
        shell: python
        run: |
          from pathlib import Path
          import ast
          forms = {
            'spectral_form.py': 'grp_se',
            'self_energy_form.py': 'grp_spec',
            'phase_diagram_form.py': 'grp_pd',
            'susceptibility_form.py': 'grp_susc',
            'conductivity_form.py': 'grp_cond',
          }
          root=Path('pyside6_studio/widgets/study_forms')
          for name, card in forms.items():
              p=root/name
              text=p.read_text(encoding='utf-8')
              marker='    self.param_stack.addWidget('+card+')\n    return addWidget'
              if marker not in text:
                  raise SystemExit(f'expected extracted tail missing: {name}')
              text=text.replace(marker, '    return '+card, 1)
              p.write_text(text,encoding='utf-8')
              ast.parse(text)
          ast.parse(Path('pyside6_studio/main_window.py').read_text(encoding='utf-8'))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyside6_studio/widgets/study_forms
          git diff --cached --check
          git commit -m "fix: return extracted study form cards"
          git push origin HEAD:experiment-debloat
